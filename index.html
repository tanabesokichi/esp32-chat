<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ESP32 Chat</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESP32 Chat">
<link rel="apple-touch-icon" href="icon.png">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  background: #0f172a;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: #1e293b;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 70%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
}

.me {
  background: #22c55e;
  color: black;
  align-self: flex-end;
}

.other {
  background: #334155;
  align-self: flex-start;
}

/* 時刻 */
.time {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 4px;
  text-align: right;
}

.other .time {
  text-align: left;
}

#inputArea {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  margin-left: 10px;
  padding: 10px;
  border-radius: 10px;
  background: #22c55e;
  border: none;
}
</style>
</head>

<body>

<header>ESP32 CHAT</header>

<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="msg" placeholder="メッセージ入力">
  <button onclick="sendMsg()">送信</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAC5HinJ-hMiNm5rdUFXtIsMnv5jyWYI",
  databaseURL: "https://esp32-chat2-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let lastMessage = "";

// 通知許可
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}

// ===== 時刻フォーマット =====
function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2, '0') + ":" +
         d.getMinutes().toString().padStart(2, '0');
}

// ===== 送信 =====
function sendMsg() {
  const text = document.getElementById("msg").value;
  if (!text) return;

  db.ref("chat").push({
    text: text,
    sender: "web",
    time: Date.now() // ← ここが追加ポイント
  });

  document.getElementById("msg").value = "";
}

// ===== 受信 =====
db.ref("chat").on("child_added", snapshot => {
  const data = snapshot.val();

  const div = document.createElement("div");
  div.classList.add("message");

  if (data.sender === "web") {
    div.classList.add("me");
  } else {
    div.classList.add("other");

    // 通知
    if (data.text !== lastMessage) {
      new Notification("新着メッセージ", {
        body: data.text
      });
      lastMessage = data.text;
    }
  }

  // メッセージ本文
  const text = document.createElement("div");
  text.textContent = data.text;

  // 時刻
  const time = document.createElement("div");
  time.classList.add("time");
  time.textContent = formatTime(data.time || Date.now());

  div.appendChild(text);
  div.appendChild(time);

  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
