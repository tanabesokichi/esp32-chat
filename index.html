<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP32 Chat</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  background: #0f172a; /* 落ち着いたダーク */
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ヘッダー */
header {
  background: #1e293b;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

/* チャットエリア */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

/* 吹き出し */
.message {
  max-width: 70%;
  padding: 10px 14px;
  margin: 6px 0;
  border-radius: 16px;
  font-size: 15px;
}

/* 相手 */
.other {
  background: #334155;
  align-self: flex-start;
}

/* 自分 */
.me {
  background: #22c55e;
  color: black;
  align-self: flex-end;
}

/* 入力エリア */
#inputArea {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<header>ESP32 CHAT</header>

<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="msg" placeholder="メッセージ入力">
  <button onclick="sendMsg()">送信</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAC5HinJ-hMiNm5rdUFXtIsMnXNv5jyWYI",
  databaseURL: "https://esp32-chat2-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== 送信 =====
function sendMsg() {
  const text = document.getElementById("msg").value;
  if (!text) return;

  db.ref("chat").push({
    text: text,
    sender: "web"
  });

  document.getElementById("msg").value = "";
}

// ===== 受信 =====
db.ref("chat").on("child_added", snapshot => {
  const data = snapshot.val();

  const div = document.createElement("div");
  div.classList.add("message");

  if (data.sender === "web") {
    div.classList.add("me");
  } else {
    div.classList.add("other");
  }

  div.textContent = data.text;

  const chat = document.getElementById("chat");
  chat.appendChild(div);

  // 自動スクロール
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
