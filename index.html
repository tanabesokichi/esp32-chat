<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ESP32 Chat</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">

<style>
body {
  margin: 0;
  font-family: -apple-system;
  background: #0f172a;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: #1e293b;
  padding: 12px;
  text-align: center;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 70%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
}

.me {
  background: #22c55e;
  color: black;
  align-self: flex-end;
}

.other {
  background: #334155;
  align-self: flex-start;
}

.time {
  font-size: 11px;
  opacity: 0.6;
}

.status {
  font-size: 10px;
  opacity: 0.5;
  text-align: right;
}

#inputArea {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  margin-left: 10px;
  padding: 10px;
  border-radius: 10px;
  background: #22c55e;
  border: none;
}
</style>
</head>

<body>

<header>ESP32 CHAT</header>
<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="msg">
  <button onclick="sendMsg()">送信</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const config = {
  apiKey: "AIzaSyAC5HinJ-hMiNm5rdUFXtIsMnXNv5jyWYI",
  databaseURL: "https://esp32-chat2-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(config);
const db = firebase.database();

const chat = document.getElementById("chat");

// ===== 時刻 =====
function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0");
}

// ===== 送信 =====
function sendMsg() {
  const text = msg.value;
  if (!text) return;

  db.ref("chat").push({
    text: text,
    sender: "web",
    time: Date.now(),
    read: false
  });

  msg.value = "";
}

// ===== 受信 =====
db.ref("chat").on("child_added", snap => {
  const data = snap.val();
  const key = snap.key;

  const div = document.createElement("div");
  div.classList.add("message");

  if (data.sender === "web") {
    div.classList.add("me");

    // 長押し削除
    let timer;
    div.addEventListener("touchstart", () => {
      timer = setTimeout(() => {
        if (confirm("削除 or 編集する？\nOK=削除 / キャンセル=編集")) {
          db.ref("chat/" + key).remove();
        } else {
          const newText = prompt("編集", data.text);
          if (newText) {
            db.ref("chat/" + key).update({ text: newText });
          }
        }
      }, 600);
    });

    div.addEventListener("touchend", () => clearTimeout(timer));

  } else {
    div.classList.add("other");

    // 通知
    if (Notification.permission === "granted") {
      new Notification("新着", { body: data.text });
    }

    // 既読にする
    db.ref("chat/" + key).update({ read: true });
  }

  const text = document.createElement("div");
  text.textContent = data.text;

  const time = document.createElement("div");
  time.classList.add("time");
  time.textContent = formatTime(data.time);

  const status = document.createElement("div");
  status.classList.add("status");

  if (data.sender === "web") {
    status.textContent = data.read ? "既読" : "未読";
  }

  div.appendChild(text);
  div.appendChild(time);
  div.appendChild(status);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});

// ===== 削除反映 =====
db.ref("chat").on("child_removed", snap => {
  location.reload();
});

// ===== 編集反映 =====
db.ref("chat").on("child_changed", snap => {
  location.reload();
});
</script>

</body>
</html>
